[project]
name = "elance-fit"
type = "app"
domain = "elance.fit"
redirect_domains = []

[environment]
development = false

[deploy]
target = "cloudflare-workers"

[deploy.services.front]
url = "elance.fit"
needs = ["api"]
entry = "apps/front/dist/server/entry.mjs"

[deploy.services.api]
url = "api.elance.fit"
needs = ["d1"]
entry = "apps/api/dist/worker.mjs"

[deploy.services.mcp]
url = "mcp.elance.fit"
needs = ["api"]
entry = "apps/mcp/dist/worker.mjs"

[services.d1]
migrations_folder = "apps/api/drizzle"
check_command = "pnpm --filter @elance/api exec drizzle-kit check"
