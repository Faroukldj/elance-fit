[project]
name = "fitapp"
type = "app"
domain = "elance.fit"
redirect_domains = ["www.elance.fit"]

[environment]
development = false

[deploy]
target = "cloudflare-workers"

[deploy.services.front]
url = "elance.fit"
needs = ["api"]
entry = "apps/front/dist/server/entry.mjs"

[deploy.services.api]
url = "api.elance.fit"
needs = ["d1"]
entry = "apps/api/src/worker.ts"

[deploy.services.mcp]
url = "mcp.elance.fit"
needs = ["api"]
entry = "apps/mcp/src/worker.ts"

[services.d1]
migrations_folder = "apps/api/drizzle"
check_command = "pnpm --filter @fitapp/api exec drizzle-kit check"
