name: Infrastructure plan

on:
    pull_request:
        branches: [main]
        paths:
            - nextnode.toml
            - .github/workflows/deploy-*.yml
            - .github/workflows/plan.yml

permissions:
    contents: read
    pull-requests: write
    id-token: write

jobs:
    plan:
        uses: NextNodeSolutions/core/.github/workflows/plan-diff.yml@main
        with:
            environment: production
